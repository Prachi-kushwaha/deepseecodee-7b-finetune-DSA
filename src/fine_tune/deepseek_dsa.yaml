model:
  model_name: "/tmp/deepseek_cache"
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true
  use_flash_attention_2: true
  trust_remote_code: true
  gradient_checkpointing: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.1
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: "none"
  task_type: "CAUSAL_LM"

data:
  dataset_name: "Prachi01/dsa-dataset-unified"
  max_seq_length: 2048
  val_split_ratio: 0.05
  num_proc: 4
  pack_sequences: true
  min_token_length: 32
  max_token_length: 2048

training:
  output_dir: "./outputs/deepseek-dsa-sft"
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  num_train_epochs: 3
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  optim: "paged_adamw_8bit"
  bf16: true
  tf32: true
  logging_steps: 10
  eval_steps: 200
  save_steps: 200
  load_best_model_at_end: true
  save_total_limit: 3
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  group_by_length: true
  report_to: "wandb"
  run_name: "deepseek-dsa-sft-v1"
  seed: 42
  resume_from_checkpoint: null

experiment:
  project_name: "deepseek-dsa-sft"
  tags:
    - "deepseek"
    - "dsa"
    - "sft"
    - "qlora"
  notes: "QLoRA fine-tuning of DeepSeek Coder on DSA dataset"
  merge_adapter_after_training: true
  push_to_hub: false
  hub_model_id: null
